name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - run: npx terser src/better-tab.js -o better-tab.min.js --compress --mangle
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            src/better-tab.js
            better-tab.min.js
